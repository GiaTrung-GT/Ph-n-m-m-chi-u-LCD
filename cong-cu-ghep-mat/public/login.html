<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập quản trị</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main style="max-width:420px">
  <h1>Quản trị ấn phẩm</h1>
  <p class="sub">Nhập mật khẩu quản trị để tiếp tục.</p>
  <form class="card" id="f">
    <input type="password" id="pw" placeholder="Mật khẩu" autofocus>
    <div style="margin-top:12px"><button class="big">Đăng nhập</button></div>
    <div class="msg" id="msg"></div>
  </form>
</main>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const r = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: document.getElementById('pw').value }),
  });
  if (r.ok) return location.reload();
  const m = document.getElementById('msg');
  m.textContent = 'Sai mật khẩu';
  m.className = 'msg show err';
});
</script>
</body>
</html>
