<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Màn hình trình chiếu</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📺</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }

    #stage {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      transform-origin: top left;
    }
    #stage.rot90  { transform: rotate(90deg) translateY(-100%);  width: 100vh; height: 100vw; }
    #stage.rot180 { transform: rotate(180deg) translate(-100%, -100%); }
    #stage.rot270 { transform: rotate(-90deg) translateX(-100%); width: 100vh; height: 100vw; }

    #stage video, #stage img {
      width: 100%; height: 100%;
      display: none;
      object-fit: contain;
      background: #000;
    }

    #standby {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #556;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 24px;
    }
    #standby h1 { font-size: 28px; font-weight: 600; color: #99a; }
    #standby p { font-size: 16px; }
    #standby .dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: #e33;
    }
    #standby .dot.on { background: #2c5; }
    #standby.hidden { display: none; }

    #soundHint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 20px;
      padding: 14px 22px;
      border-radius: 12px;
      display: none;
      z-index: 10;
    }
    #soundHint.show { display: block; }
  </style>
</head>
<body>
  <div id="stage">
    <video id="video" autoplay playsinline preload="auto"></video>
    <img id="image" alt="">
  </div>
  <div id="standby">
    <div class="dot" id="connDot"></div>
    <h1 id="screenName">Màn hình trình chiếu</h1>
    <p id="standbyMsg">Đang kết nối tới máy chủ...</p>
  </div>
  <div id="soundHint">🔊 Chạm vào màn hình hoặc bấm OK trên điều khiển một lần để bật âm thanh</div>
  <script src="/player.js"></script>
</body>
</html>
