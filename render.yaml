# Cấu hình triển khai lên Render.com — dịch vụ cloud, giúp màn hình ở bất kỳ
# đâu có Internet đều kết nối được (không cần chung Wi-Fi với máy tính).
#
# Cách dùng: đăng nhập render.com bằng tài khoản GitHub -> New + -> Blueprint
# -> chọn repository này -> Render tự đọc file này và dựng server.
# Sau khi tạo xong, vào Environment đặt ADMIN_PASSWORD (mật khẩu trang quản trị).
services:
  - type: web
    name: phan-mem-chieu-lcd
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: ADMIN_PASSWORD
        sync: false # Render sẽ hỏi bạn nhập mật khẩu khi tạo dịch vụ
    disk:
      name: du-lieu-media
      mountPath: /opt/render/project/src/data
      sizeGB: 10

  # Công cụ ghép mặt nhân viên vào ấn phẩm (thư mục cong-cu-ghep-mat/).
  # Khi tạo, Render sẽ hỏi GEMINI_API_KEY (lấy tại aistudio.google.com/apikey)
  # và ADMIN_PASSWORD (mật khẩu trang /admin).
  - type: web
    name: cong-cu-ghep-mat
    runtime: node
    plan: starter
    rootDir: cong-cu-ghep-mat
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-image
      - key: LIMIT_PER_HOUR
        value: "10"
    disk:
      name: du-lieu-an-pham
      mountPath: /opt/render/project/src/cong-cu-ghep-mat/data
      sizeGB: 1
